version: "3.9"   # Works fine with Docker Compose v2

services:

  hub:
    image: seleniarm/hub:4.20
    container_name: selenium-hub
    ports:
      - "4444:4444"
    environment:
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=10
      - GRID_BROWSER_TIMEOUT=300000
      - GRID_TIMEOUT=300000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 20s
      timeout: 10s
      retries: 5

  chrome:
    image: seleniarm/node-chromium:4.20
    shm_size: "2g"
    depends_on:
      - hub
    environment:
      - SE_EVENT_BUS_HOST=hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_INSTANCES=4
      - SE_NODE_MAX_SESSIONS=4
    deploy:
      # NOTE: Ignored by Compose v2 but kept harmlessly
      restart_policy:
        condition: on-failure

  firefox:
    image: seleniarm/node-firefox:4.20
    shm_size: "2g"
    depends_on:
      - hub
    environment:
      - SE_EVENT_BUS_HOST=hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_INSTANCES=4
      - SE_NODE_MAX_SESSIONS=4
    deploy:
      # NOTE: Ignored by Compose v2 but harmless
      restart_policy:
        condition: on-failure
